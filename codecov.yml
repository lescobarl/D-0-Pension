# Codecov status configuration.
#
# Coverage gate: the project target is 40%. The gate is informational for now
# so it never hard-fails the pipeline while real coverage climbs; the 40%
# requirement is still surfaced in the Codecov status check and PR comments.
# Raise `informational: false` once sustained coverage exceeds the target.
coverage:
  status:
    project:
      default:
        target: 40%
        threshold: 1%
        informational: true
    patch:
      default:
        target: 40%
        threshold: 1%
        informational: true
