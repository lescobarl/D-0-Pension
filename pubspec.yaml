name: d_0_pension
description: "Calculadora de pension Ley 1973 IMSS - Modalidad 40 y Pago Retroactivo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  in_app_purchase: ^3.1.11
  in_app_purchase_android: ^0.5.0
  video_player: ^2.10.0
  crypto: ^3.0.6
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/ley73_bootstrap.json
    - assets/config/app_metadata.json
    - assets/config/api_key.json
    - assets/videos/
